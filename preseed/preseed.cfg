# =============================================================
# preseed.cfg — internet-sehat DNS Ecosystem
# Debian 12 (Bookworm) unattended install
# =============================================================

# ── Locale & Keyboard ─────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ── Network ───────────────────────────────────────────────────
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string internet-sehat-dns
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# ── Clock ─────────────────────────────────────────────────────
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Jakarta

# ── Disk ──────────────────────────────────────────────────────
# Hapus seluruh disk, partisi atomic (single root + swap)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Akun ──────────────────────────────────────────────────────
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password ADMIN_PASSWORD_HASH

d-i passwd/make-user boolean true
d-i passwd/user-fullname string Admin
d-i passwd/username string admin
d-i passwd/user-password-crypted password ADMIN_PASSWORD_HASH
d-i passwd/user-default-groups string sudo

# ── Packages ──────────────────────────────────────────────────
# Tidak install recommended packages — tetap minimal
d-i pkgsel/install-recommends boolean false

# Tidak ada tasksel task (no desktop, no standard utilities)
tasksel tasksel/first multiselect

# Hanya package yang benar-benar dibutuhkan
d-i pkgsel/include string \
    dnsdist \
    freecdb \
    python3-minimal \
    cron \
    openssh-server \
    curl \
    bind9-dnsutils \
    sudo \
    iproute2

# Tidak ada auto-update
d-i pkgsel/update-policy select none

# ── Bootloader ────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# ── Late command ──────────────────────────────────────────────
# Salin project dan setup first-boot installer
d-i preseed/late_command string \
    cp -a /cdrom/internet-sehat /target/opt/ ; \
    chmod -R 755 /target/opt/internet-sehat ; \
    touch /target/opt/internet-sehat/.setup-pending ; \
    mkdir -p /target/etc/systemd/system/getty@tty1.service.d ; \
    cp /cdrom/preseed/getty-autologin.conf /target/etc/systemd/system/getty@tty1.service.d/autologin.conf ; \
    cp /cdrom/preseed/firstboot-profile.sh /target/root/.bash_profile ; \
    chmod 644 /target/root/.bash_profile

# ── Finish ────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
