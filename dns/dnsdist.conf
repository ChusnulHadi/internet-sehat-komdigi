-- =============================================================
-- dnsdist.conf
-- DNS Ecosystem - internet-sehat
-- Compatible: dnsdist 1.9.x
-- =============================================================

-- ---------------------------------------------------------------
-- KONFIGURASI UTAMA
-- Nilai dibaca dari environment variable jika tersedia,
-- jatuh ke default jika tidak. install.sh meng-overwrite baris ini
-- via sed (pattern ^local VAR\s*=.*) untuk instalasi bare-metal.
-- ---------------------------------------------------------------

-- Helper: parse ACL string "a,b,c" → {"a","b","c","127.0.0.0/8","::/0"}
-- Loopback (127.0.0.0/8) SELALU ditambahkan agar localhost tidak pernah
-- ke-refuse meski ACL dibatasi ke subnet tertentu — dipakai dashboard,
-- dig test, & healthcheck yang query ke 127.0.0.1.
local function parseACL(s)
  local t = {}
  for v in s:gmatch("[^,]+") do t[#t+1] = v:match("^%s*(.-)%s*$") end
  t[#t+1] = "127.0.0.0/8"
  t[#t+1] = "::/0"
  return t
end

local LISTEN_ADDR   = os.getenv("DNSDIST_LISTEN_ADDR")        or "0.0.0.0"
local LISTEN_PORT   = 53

-- ACL: siapa yang boleh query. Gunakan "0.0.0.0/0" untuk semua,
-- atau batasi ke subnet tertentu, misal "192.168.1.0/24"
local CLIENT_ACL    = parseACL(os.getenv("DNSDIST_CLIENT_ACL") or "0.0.0.0/0")

-- Mode blokir: "nxdomain" atau "redirect"
local BLOCK_MODE    = os.getenv("DNSDIST_BLOCK_MODE")          or "nxdomain"

-- IP tujuan redirect (hanya dipakai jika BLOCK_MODE = "redirect")
-- Arahkan ke webserver yang menampilkan halaman "domain diblokir"
local REDIRECT_IP   = os.getenv("DNSDIST_REDIRECT_IP")         or "0.0.0.0"

-- Path CDB blocklist
local BLOCKLIST_CDB  = "/opt/blocklist/blocklist.cdb"
local WHITELIST_CDB  = "/opt/blocklist/whitelist.cdb"

-- Dashboard API (port 8083) — dipakai oleh Next.js dashboard
local DASHBOARD_LISTEN   = os.getenv("DNSDIST_DASHBOARD_LISTEN")   or "0.0.0.0:8083"
local DASHBOARD_PASSWORD = os.getenv("DNSDIST_DASHBOARD_PASSWORD") or "changeme"
local DASHBOARD_API_KEY  = os.getenv("DNSDIST_DASHBOARD_API_KEY")  or "changeme"

-- CDB refresh interval (detik) - reload otomatis jika file berubah
local CDB_REFRESH    = 60

-- ---------------------------------------------------------------
-- LISTEN
-- ---------------------------------------------------------------

-- 2 thread UDP listener dengan reusePort — OS distribusi packet antar thread
-- maxInFlight: antre hingga 65535 query sebelum drop (bukan diam-diam buang)
local LISTEN_THREADS = 2
for _ = 1, LISTEN_THREADS do
  addLocal(LISTEN_ADDR .. ":" .. LISTEN_PORT, {
    reusePort   = true,
    maxInFlight = 65535,
  })
end

-- Perbesar UDP socket buffer OS supaya burst tidak overflow di kernel level
setUDPSocketBufferSizes(4194304, 4194304)

-- TCP: lebih banyak thread untuk klien yang fallback ke TCP
setMaxTCPClientThreads(20)
setMaxTCPQueuedConnections(1000)
setMaxTCPConnectionDuration(60)

-- ---------------------------------------------------------------
-- CLIENT ACL
-- ---------------------------------------------------------------

setACL(CLIENT_ACL)

-- ---------------------------------------------------------------
-- RING BUFFER (untuk statistik, console, dan webserver)
-- ---------------------------------------------------------------

setRingBuffersSize(100000, 10)

-- ---------------------------------------------------------------
-- PACKET CACHE
-- Cache response DNS untuk mengurangi beban upstream
-- ---------------------------------------------------------------

local cacheSettings = newPacketCache(1000000, {
  maxTTL              = 86400,    -- max 1 hari
  minTTL              = 0,        -- cache sesuai TTL asli; record TTL-pendek (CNAME mbanking 1-5 dtk) tetap dapat buffer + proteksi stale
  temporaryFailureTTL = 5,        -- cache SERVFAIL singkat saja; jangan amplifikasi blip transient jadi 60 dtk
  staleTTL            = 600,      -- sajikan stale cache 10 menit kalau upstream down
  keepStaleData       = true,     -- WAJIB: tanpa ini staleTTL tidak benar-benar menyajikan jawaban lama
  dontAge             = false,
  parseECS            = false,    -- abaikan ECS sebagai cache key → hit rate lebih stabil lintas subnet
})
getPool(""):setCache(cacheSettings)

-- ---------------------------------------------------------------
-- UPSTREAM SERVERS
-- ---------------------------------------------------------------

-- Kebijakan: least outstanding (pilih upstream yang paling sedikit
-- query pending-nya)
setServerPolicy(leastOutstanding)

newServer({
  address          = "1.1.1.1:53",
  name             = "cloudflare-primary",
  checkInterval    = 5,
  checkTimeout     = 1000,
  maxCheckFailures = 3,
  rise             = 2,
  retries          = 2,
})

newServer({
  address          = "1.0.0.1:53",
  name             = "cloudflare-secondary",
  checkInterval    = 5,
  checkTimeout     = 1000,
  maxCheckFailures = 3,
  rise             = 2,
  retries          = 2,
})

newServer({
  address          = "9.9.9.9:53",
  name             = "quad9-primary",
  checkInterval    = 5,
  checkTimeout     = 1000,
  maxCheckFailures = 3,
  rise             = 2,
  retries          = 2,
})

newServer({
  address          = "149.112.112.112:53",
  name             = "quad9-secondary",
  checkInterval    = 5,
  checkTimeout     = 1000,
  maxCheckFailures = 3,
  rise             = 2,
  retries          = 2,
})

-- ---------------------------------------------------------------
-- RATE LIMITING
-- Proteksi dari query flood per IP
-- ---------------------------------------------------------------

-- Soft limit: > 2000 QPS per IP → delay
addAction(MaxQPSIPRule(2000, 32, 64), DelayAction(200))

-- Hard limit: > 5000 QPS per IP → drop
addAction(MaxQPSIPRule(5000, 32, 64), DropAction())

-- ---------------------------------------------------------------
-- BLOCKLIST & WHITELIST (CDB)
-- ---------------------------------------------------------------

-- Helper: cek apakah file ada
local function fileExists(path)
  local f = io.open(path, "r")
  if f then f:close(); return true end
  return false
end

-- Whitelist: domain yang TIDAK boleh diblokir meski ada di blocklist
-- Whitelist dicek PERTAMA sebelum blocklist
if fileExists(WHITELIST_CDB) then
  local whitelist = newCDBKVStore(WHITELIST_CDB, CDB_REFRESH)
  -- Tandai query yang ada di whitelist dengan tag "whitelisted"
  addAction(
    KeyValueStoreLookupRule(whitelist, KeyValueLookupKeyQName(false)),
    SetTagAction("whitelisted", "1")
  )
  infolog("Whitelist loaded: " .. WHITELIST_CDB)
else
  infolog("Whitelist CDB not found, skipping: " .. WHITELIST_CDB)
end

-- ---------------------------------------------------------------
-- BLOCKLIST (Option D: CDB exact + Lua parent-walk untuk subdomain)
--
-- Cara kerja:
--   Query "pornhub.com"       → CDB exact hit           → block (C++ path, cepat)
--   Query "www.pornhub.com"   → CDB exact miss          → Lua cek parent "pornhub.com" → hit → block
--   Query "cdn.x.pornhub.com" → CDB exact miss          → Lua walk: x.pornhub.com miss,
--                                                           pornhub.com hit → block
--   Query "google.com"        → CDB exact miss          → Lua walk: semua miss → pass
--
-- RAM: ~50-100 MB (CDB di-mmap OS, tidak load ke heap)
-- ---------------------------------------------------------------

if not fileExists(BLOCKLIST_CDB) then
  infolog("WARNING: Blocklist CDB tidak ditemukan — blocking tidak aktif: " .. BLOCKLIST_CDB)
else
  local blocklist = newCDBKVStore(BLOCKLIST_CDB, CDB_REFRESH)
  infolog("Blocklist CDB loaded: " .. BLOCKLIST_CDB)

  -- Action yang dipakai untuk memblokir
  local block_action
  if BLOCK_MODE == "redirect" then
    block_action = SpoofAction({ REDIRECT_IP })
    infolog("Block mode: redirect to " .. REDIRECT_IP)
  else
    block_action = RCodeAction(DNSRCode.NXDOMAIN)
    infolog("Block mode: NXDOMAIN")
  end

  -- ── Rule 1: Exact match (C++ path — sangat cepat) ──────────────
  addAction(
    AndRule({
      NotRule(TagRule("whitelisted", "1")),
      KeyValueStoreLookupRule(blocklist, KeyValueLookupKeyQName(false))
    }),
    block_action
  )

  -- ── Rule 2: Parent-walk (Lua path — hanya jalan jika exact miss) ─
  -- Untuk handle subdomain wildcard dari Komdigi:
  -- "*.pornhub.com" di RPZ → query "www.pornhub.com" → cek parent "pornhub.com" → hit
  --
  -- Memo cache: simpan hasil lookup per QNAME supaya CDB tidak dipanggil
  -- berulang untuk domain yang sama. Di-reset tiap CDB_REFRESH detik
  -- mengikuti window reload CDB.
  local _parentCache   = {}
  local _parentCacheTs = 0

  local function parentInBlocklist(dq)
    local now = os.time()
    if now - _parentCacheTs >= CDB_REFRESH then
      _parentCache   = {}
      _parentCacheTs = now
    end

    local qname = dq.qname:toString():lower()
    if qname:sub(-1) == "." then qname = qname:sub(1, -2) end

    local cached = _parentCache[qname]
    if cached ~= nil then return cached end

    local name   = qname
    local result = false
    repeat
      local dot = name:find(".", 1, true)
      if not dot then break end
      name = name:sub(dot + 1)
      if #name == 0 then break end
      if blocklist:lookup(name) ~= "" then result = true; break end
    until false

    _parentCache[qname] = result
    return result
  end

  addAction(
    AndRule({
      NotRule(TagRule("whitelisted", "1")),
      LuaRule(parentInBlocklist)
    }),
    block_action
  )

end

-- ---------------------------------------------------------------
-- CONSOLE (untuk debug & monitoring via CLI)
-- Generate key sekali: jalankan `dnsdist` lalu ketik `makeKey()`
-- Copy output ke sini
-- ---------------------------------------------------------------

controlSocket("127.0.0.1:5199")
-- setKey("GANTI_DENGAN_OUTPUT_makeKey()")

-- ---------------------------------------------------------------
-- QUERY LOGGING (opsional, comment out jika tidak dipakai)
-- Aktifkan saat debug, matikan di produksi untuk performa
-- ---------------------------------------------------------------

-- addAction(AllRule(), LogAction("/var/log/dnsdist/queries.log", false, true, false))

-- ---------------------------------------------------------------
-- STATISTIK
-- Webserver built-in dnsdist untuk metrics (port 8083)
-- Akan dipakai oleh dashboard nanti
-- ---------------------------------------------------------------

-- 1.9.x+: webserver(addr) + setWebserverConfig({apiKey=...})
-- 1.8.x:  webserver(addr, password, apikey) — positional, lowercase apikey
if setWebserverConfig then
  webserver(DASHBOARD_LISTEN)
  setWebserverConfig({ password = DASHBOARD_PASSWORD, apiKey = DASHBOARD_API_KEY })
else
  webserver(DASHBOARD_LISTEN, DASHBOARD_PASSWORD, DASHBOARD_API_KEY)
end

infolog("dnsdist started - DNS Ecosystem internet-sehat")
